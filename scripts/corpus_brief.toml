# Domain brief for the LLM-generated TAC knowledge corpus.
#
# generate_corpus.py reads this file, asks the LLM to invent the facts (issues,
# error codes, features, guide topics, customers) inside these constraints, and
# then asks it to write every document grounded on those facts.
#
# Change the vendor, products or style here to generate a different corpus;
# no code changes are needed. Everything is fictional.

[vendor]
name = "Veridane Networks"
team = "Veridane Technical Assistance Center (TAC)"
domain = "enterprise networking: routing, security, wireless, SD-WAN and data-center switching"
audience = "network engineers at enterprise customers, and TAC support engineers"

[style]
guide = """
- Write like an experienced vendor TAC / technical-documentation team: precise, neutral, no marketing language.
- Use concrete, plausible technical detail: protocol behaviour, timer values, thresholds, counters, CLI commands, log lines.
- CLI commands are lower-case, single-line and consistent with the product's CLI notes. Do not invent GUI click-paths unless natural.
- Log messages follow either '%FACILITY-SEVERITY-MNEMONIC' (e.g. %BGP-3-NOTIFICATION) or 'ERR-AREA-NNNN' (e.g. ERR-ORCH-4412).
- Timestamps in sample output use ISO 8601 UTC, e.g. 2026-03-14T02:13:07Z. Use documentation IP ranges (192.0.2.0/24, 198.51.100.0/24, 203.0.113.0/24, 10.0.0.0/8).
- All companies, people, products and versions are fictional. Never mention real vendors, real products or real people.
- Standards (RFCs, IEEE 802.11 amendments, etc.) may be referenced by number.
- Never contradict the facts you are given. Never invent other KB, ticket or release-note identifiers.
"""

[counts]
issues_per_product = 12          # one KB article each
tickets_per_issue = 5            # resolved tickets per (non-duplicate) issue
how_to_tickets = 10              # tickets resolved by pointing to a product guide
customers = 15
unanswerable = 6                 # questions the corpus deliberately cannot answer
guide_sections = 6               # sections per product guide (PDF)
guide_questions_per_product = 2  # how-to questions answered by each guide
min_fixed_issues_per_product = 5 # issues with a software fix (feed release notes and multi-hop questions)

[traps]
version_twin_pairs_per_product = 1    # same symptom area, different version family, different root cause
near_duplicate_pairs_per_product = 1  # two KBs with the same error code, written differently

[golden]                          # golden evaluation set mix (capped by what the facts allow)
single_hop = 16
version_specific = 10             # every version-twin issue
error_code = 8
multi_hop = 8
how_to = 6
similar_case = 4
unanswerable = 6

# ── Pinned product catalog ────────────────────────────────────────────────────
# Names and version trains are fixed so the notebooks' product filters keep working.
# kb_prefix: KB IDs for the product are KB-<prefix><nn>, e.g. KB-2101.
# Versions are listed oldest -> newest.

[[products]]
code = "AR"
name = "Aurora AR-900"
kind = "edge router"
kb_prefix = "21"
versions = ["9.1.4", "9.1.6", "9.2.0", "9.2.1", "9.2.3", "9.3.0"]
cli = "Hierarchical configuration mode entered with 'configure'. Operational commands start with 'show', 'clear', 'debug'. Examples: 'show bgp summary', 'show bfd neighbors detail', 'router bgp 65001'."
focus = "BGP, BFD, OSPF, IPv6, QoS, control-plane protection, SNMP, NAT, high CPU and memory"

